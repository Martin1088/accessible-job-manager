name: Release (image)

# A pushed tag is the release. Nothing here decides what to publish - the tag
# name is the version, and `release.sh` is what creates it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/martin1088/accessible-job-manager

jobs:
  release:
    name: Test, build image, push to ghcr.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The tag itself, so `git describe` inside the Gradle build resolves
          # to the same version the image is tagged with.
          fetch-depth: 0

      - name: Derive version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AppClient/package-lock.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install frontend dependencies
        working-directory: AppClient
        run: npm ci

      # The image build runs `build -x test`, so the tests have to run here or
      # they do not run for the release at all.
      - name: Build and test with Gradle
        run: ./gradlew build --no-daemon

      # The acceptance criterion, as a check rather than a claim: what the
      # build calls itself has to be what the image will be tagged with.
      - name: Version matches the tag
        run: |
          built="$(./gradlew -q --no-daemon properties | awk '/^version:/ { print $2 }')"
          if [ "$built" != "${{ steps.version.outputs.version }}" ]; then
            echo "build version '$built' does not match tag '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          echo "version $built"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only for a plain version. A pre-release tag such as v1.0.0-rc1
      # would otherwise become the default pull for everyone, including the
      # Azure deployment, which defaults to `:latest`.
      - name: Image tags
        id: tags
        run: |
          tags="${IMAGE}:${GITHUB_REF_NAME}"
          case "${{ steps.version.outputs.version }}" in
            *-*) echo "pre-release, not tagging latest" ;;
            *)   tags="${tags},${IMAGE}:latest" ;;
          esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
