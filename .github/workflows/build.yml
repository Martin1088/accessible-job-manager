name: Build (Gradle)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Gradle build (backend tests + frontend production build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AppClient/package-lock.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ./gradlew build shells out to `npm run build` (via the npmBuild task),
      # which needs node_modules/.bin/ng on PATH already.
      - name: Install frontend dependencies
        working-directory: AppClient
        run: npm ci

      # Runs backend unit tests (via the `test` task) and, through the
      # npmBuild/copyFrontend tasks wired into processResources, also
      # produces the Angular production build.
      - name: Build with Gradle
        run: ./gradlew build --no-daemon

  frontend-tests:
    name: Angular unit tests (Karma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppClient

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AppClient/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npx ng test --watch=false --browsers=ChromeHeadless
