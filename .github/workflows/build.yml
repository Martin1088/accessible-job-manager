name: Build (Gradle)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Gradle build (backend tests + frontend production build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AppClient/package-lock.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ./gradlew build shells out to `npm run build` (via the npmBuild task),
      # which needs node_modules/.bin/ng on PATH already.
      - name: Install frontend dependencies
        working-directory: AppClient
        run: npm ci

      # Runs backend unit tests (via the `test` task) and, through the
      # npmBuild/copyFrontend tasks wired into processResources, also
      # produces the Angular production build.
      - name: Build with Gradle
        run: ./gradlew build --no-daemon

  frontend-tests:
    name: Angular unit tests (Karma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppClient

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AppClient/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npx ng test --watch=false --browsers=ChromeHeadless

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: [build, frontend-tests]
    # Only publish from the two long-lived branches, and only on a real
    # push to them (not on PRs, which may come from forks without
    # package-write access).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase; the GitHub username/repo
      # here isn't (Martin1088), so github.repository can't be used as-is.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Tags produced per push:
      #   - <branch>        floating pointer to the latest build of that branch (main / develop)
      #   - sha-<short-sha> immutable, traceable to the exact commit
      #   - latest          only on main (the default branch)
      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
