name: Build (Gradle)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Gradle build (backend tests + frontend production build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AppClient/package-lock.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install frontend dependencies
        working-directory: AppClient
        run: npm ci

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

  frontend-tests:
    name: Angular unit tests (Karma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppClient

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AppClient/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Accessibility gate. Every template in src/ passes today, so any new
      # violation is a regression introduced by the commit under test. The
      # general `npm run lint` is deliberately not run here: it reports
      # pre-existing style debt as warnings and would only add noise.
      - name: Lint templates for accessibility
        run: npm run lint:a11y

      - name: Run tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npx ng test --watch=false --browsers=ChromeHeadless

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: [build, frontend-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
