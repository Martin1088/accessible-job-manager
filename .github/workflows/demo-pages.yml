# Publishes the static demo build to GitHub Pages.
#
# Separate from build.yml on purpose: this produces no Docker image, runs no
# backend tests, and must not write into src/main/resources/static. It runs on a
# tag or by hand, not on every push - the demo link is something people are given
# deliberately.
name: Demo (GitHub Pages)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes a waiting one but never
# cancels a deployment that is already running.
concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the demo bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppClient

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AppClient/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The sample letter is the one artefact that cannot be faked: it is a real
      # tagged PDF/UA document produced through Gotenberg, and it is what makes
      # the accessibility claim checkable. Publishing the demo without it would
      # ship a download button that 404s, so the build stops here instead.
      - name: Require the sample PDF
        run: |
          if [ ! -f public/demo/anschreiben-muster.pdf ]; then
            echo "public/demo/anschreiben-muster.pdf fehlt."
            echo "Einmal über den echten Gotenberg-Weg erzeugen, mit veraPDF prüfen und einchecken."
            exit 1
          fi

      - name: Lint templates for accessibility
        run: npm run lint:a11y

      - name: Build demo
        run: npm run build:demo

      # The acceptance criterion of the demo, checked rather than asserted: load
      # the built bundle and prove it makes no request to /api/.
      - name: Verify the demo makes no backend calls
        run: |
          # The bundle is built with --base-href=/accessible-job-manager/, so it
          # has to be served under that path for its asset URLs to resolve.
          mkdir -p serve && ln -sfn "$PWD/dist/demo/browser" serve/accessible-job-manager
          npx --yes http-server serve -p 8099 --silent &
          npx --yes wait-on -t 30000 http://127.0.0.1:8099/accessible-job-manager/
          npm run check:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: AppClient/dist/demo/browser

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
