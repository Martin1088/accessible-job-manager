# Salutation word -> Gender (MALE|FEMALE), used by ContactBlockExtractor.
# A contact's gender is only ever set when one of these literal words
# appears in the posting text next to their name - never guessed from a
# first name. Add more languages/forms here, not in code.

Herr=MALE
Herrn=MALE
Frau=FEMALE
Mr=MALE
Mrs=FEMALE
Ms=FEMALE
Miss=FEMALE
Monsieur=MALE
Madame=FEMALE
