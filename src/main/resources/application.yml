spring:
  application:
    name: accessible-job-manager
  devtools:
    add-properties: false
  datasource:
    url: ${MANAGER_DB_URL:jdbc:postgresql://localhost:5432/manager}
    username: ${MANAGER_DB_USER:manager}
    password: ${MANAGER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  data:
    jpa:
      repositories:
        enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          authentik:
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: "openid, email, profile"
            redirect-uri: ${OIDC_REDIRECT_URI:http://localhost:8060/login/oauth2/code/authentik}
        provider:
          authentik:
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:9000/application/o/access-job-manager/}
            authorization-uri: ${OIDC_AUTH_URI:http://localhost:9000/application/o/authorize/}


gotenberg:
  url: ${GOTENBERG_URL:http://localhost:3000}
  # Longer than Gotenberg's own --api-timeout (30s in the compose files) on
  # purpose: Gotenberg answers an over-long render with an error naming the page
  # that hung, and a client that gave up first would lose that reason. This is
  # the backstop for a Gotenberg that stopped answering at all.
  connect-timeout-seconds: ${GOTENBERG_CONNECT_TIMEOUT_SECONDS:5}
  read-timeout-seconds: ${GOTENBERG_READ_TIMEOUT_SECONDS:60}
  # How long Chromium waits after the page goes network-idle. Job boards load
  # the ad body last often enough that zero costs more imports than the second
  # costs renders.
  wait-delay: ${GOTENBERG_WAIT_DELAY:1s}
  render-cache:
    # One import calls /overview, /full-chain, /snapshot-validate and /snapshot
    # for a single URL. This is what keeps that two renders rather than four;
    # the TTL only has to outlive one pass through the import form.
    ttl-seconds: ${GOTENBERG_RENDER_CACHE_TTL_SECONDS:120}
    max-entries: ${GOTENBERG_RENDER_CACHE_MAX_ENTRIES:32}
    max-bytes: ${GOTENBERG_RENDER_CACHE_MAX_BYTES:134217728}

job-posting:
  parser:
    provider: ${JOB_POSTING_LLM_PROVIDER:ollama}
    ollama-url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
    azure:
      endpoint: ${AZURE_OPENAI_ENDPOINT:}
      deployment: ${AZURE_OPENAI_DEPLOYMENT:}
      api-version: ${AZURE_OPENAI_API_VERSION:2024-08-01-preview}
      api-key: ${AZURE_OPENAI_API_KEY:}
    extended:
      field-extraction: true

job-source:
  adzuna:
    base-url: ${JOBSOURCE_ADZUNA_BASE_URL:https://api.adzuna.com/v1/api}
    app-id: ${JOBSOURCE_ADZUNA_APP_ID:}
    app-key: ${JOBSOURCE_ADZUNA_APP_KEY:}
    country: ${JOBSOURCE_ADZUNA_COUNTRY:de}
    max-results-per-page: ${JOBSOURCE_ADZUNA_MAX_RESULTS:50}

storage:
  provider: ${STORAGE_PROVIDER:s3}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:3900}
    region: ${REGION:garage}
    bucket: ${S3_BUCKET:job-manager}
    access-key: ${ACCESS_KEY}
    secret-key: ${SECRET_KEY}
  azure:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container: ${AZURE_STORAGE_CONTAINER:documents}

server:
  port: 8060
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.springframework.security.oauth2: ${OAUTH2_LOG_LEVEL:INFO}
    org.springframework.web.client: ${WEB_CLIENT_LOG_LEVEL:INFO}
    de.samply.manager.jobsearch: ${JOBSOURCE_LOG_LEVEL:INFO}
    de.samply.manager.controller.AdvisorJobSearchController: ${JOBSOURCE_LOG_LEVEL:INFO}
    # Job-import diagnostics: one pipe-separated line per import attempt
    # (host|category|httpStatus|missingFields|url), routed by logback-spring.xml
    # to stdout with a DIAG| prefix and to DIAGNOSTICS_LOG_FILE. Off by default;
    # set DIAGNOSTICS_LOG_LEVEL=INFO on a demo system to collect the list of
    # hosts that still need an adapter.
    ajm.diagnostics: ${DIAGNOSTICS_LOG_LEVEL:OFF}
job-manager:
  metrics:
    enabled: true
    log-status-transitions: true
  outbound:
    # How long OutboundUrlGuard pins the JVM's positive DNS cache. The guard
    # approves a host's addresses and then connects by name, so a zero TTL would
    # let the answer change in between - a positive value is the safe direction
    # here, which is the opposite of the usual advice.
    dns-cache-seconds: ${OUTBOUND_DNS_CACHE_SECONDS:30}
  security:
    claim: ${OIDC_ROLES_CLAIM:groups}
    role-groups:
      USER: ${GROUP_USER:User}
      ADVISOR: ${GROUP_ADVISOR:Advisor}
      REVIEWER: ${GROUP_REVIEWER:Reviewer}
