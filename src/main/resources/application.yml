spring:
  application:
    name: accessible-job-manager
  devtools:
    add-properties: false
  datasource:
    url: ${MANAGER_DB_URL:jdbc:postgresql://localhost:5432/manager}
    username: ${MANAGER_DB_USER:manager}
    password: ${MANAGER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Small pool for a pilot; idle connections are closed after 30 s. This also
      # lets a database that scales to zero sleep, at the price of a slow first query.
      minimum-idle: ${DB_POOL_MINIMUM_IDLE:0}
      maximum-pool-size: ${DB_POOL_MAXIMUM_SIZE:5}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    jpa:
      repositories:
        enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          authentik:
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: ${OIDC_SCOPE:openid, email, profile}
            redirect-uri: ${OIDC_REDIRECT_URI:http://localhost:8060/login/oauth2/code/authentik}
        provider:
          authentik:
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:9000/application/o/access-job-manager/}
            authorization-uri: ${OIDC_AUTH_URI:http://localhost:9000/application/o/authorize/}


gotenberg:
  url: ${GOTENBERG_URL:http://localhost:3000}
  # Sent as X-Auth-Token when set: a private Scaleway container takes the caller's IAM
  # secret key there. Empty sends no header.
  auth-token: ${GOTENBERG_AUTH_TOKEN:}
  # Longer than Gotenberg's own --api-timeout (30s in the compose files) on
  # purpose: Gotenberg answers an over-long render with an error naming the page
  # that hung, and a client that gave up first would lose that reason. This is
  # the backstop for a Gotenberg that stopped answering at all.
  connect-timeout-seconds: ${GOTENBERG_CONNECT_TIMEOUT_SECONDS:5}
  read-timeout-seconds: ${GOTENBERG_READ_TIMEOUT_SECONDS:60}
  # How long Chromium waits after the page goes network-idle. Job boards load
  # the ad body last often enough that zero costs more imports than the second
  # costs renders.
  wait-delay: ${GOTENBERG_WAIT_DELAY:1s}
  render-cache:
    # One import calls /overview, /full-chain, /snapshot-validate and /snapshot
    # for a single URL. This is what keeps that two renders rather than four;
    # the TTL only has to outlive one pass through the import form.
    ttl-seconds: ${GOTENBERG_RENDER_CACHE_TTL_SECONDS:120}
    max-entries: ${GOTENBERG_RENDER_CACHE_MAX_ENTRIES:32}
    max-bytes: ${GOTENBERG_RENDER_CACHE_MAX_BYTES:134217728}

job-posting:
  parser:
    provider: ${JOB_POSTING_LLM_PROVIDER:ollama}
    ollama-url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
    connect-timeout-seconds: ${LLM_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${LLM_READ_TIMEOUT_SECONDS:120}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:300}
    azure:
      endpoint: ${AZURE_OPENAI_ENDPOINT:}
      deployment: ${AZURE_OPENAI_DEPLOYMENT:}
      api-version: ${AZURE_OPENAI_API_VERSION:2024-08-01-preview}
      api-key: ${AZURE_OPENAI_API_KEY:}
    # Any OpenAI-compatible /chat/completions endpoint, e.g. Scaleway Generative APIs
    # (https://api.scaleway.ai/{project-id}/v1 - without the project id Scaleway answers 403
    # for a key that is only valid in one project). The model travels in the body; the key
    # is a bearer token.
    openai:
      base-url: ${OPENAI_BASE_URL:}
      model: ${OPENAI_MODEL:}
      api-key: ${OPENAI_API_KEY:}
    extended:
      field-extraction: true

# The model that holds a CV against a job posting ("Check my fit"). Every value falls
# back to the posting parser's above, so nothing has to be set - but a 3B model that
# reads four fields off a posting well is usually too small to judge a CV requirement
# by requirement. Set CV_MATCHING_MODEL (and, for another provider, the rest) to give
# the matching a model of its own; Ollama for the parser and Azure OpenAI here, or the
# other way round, works too.
cv-matching:
  provider: ${CV_MATCHING_LLM_PROVIDER:${job-posting.parser.provider:ollama}}
  ollama-url: ${CV_MATCHING_OLLAMA_URL:${job-posting.parser.ollama-url:http://localhost:11434}}
  model: ${CV_MATCHING_MODEL:${job-posting.parser.model:qwen2.5:3b}}
  connect-timeout-seconds: ${CV_MATCHING_CONNECT_TIMEOUT_SECONDS:${job-posting.parser.connect-timeout-seconds:5}}
  # Its own values, not the parser's: a result runs to thousands of tokens and a local
  # model takes minutes for it, where the parser answers four fields in seconds.
  read-timeout-seconds: ${CV_MATCHING_READ_TIMEOUT_SECONDS:300}
  max-output-tokens: ${CV_MATCHING_MAX_OUTPUT_TOKENS:4000}
  # Ollama's num_ctx. Its default (2048-4096 tokens) cuts a posting plus a CV off without
  # an error; 0 leaves the model's default. Not used by Azure.
  context-window: ${CV_MATCHING_CONTEXT_WINDOW:16384}
  azure:
    endpoint: ${CV_MATCHING_AZURE_OPENAI_ENDPOINT:${job-posting.parser.azure.endpoint:}}
    deployment: ${CV_MATCHING_AZURE_OPENAI_DEPLOYMENT:${job-posting.parser.azure.deployment:}}
    api-version: ${CV_MATCHING_AZURE_OPENAI_API_VERSION:${job-posting.parser.azure.api-version:2024-08-01-preview}}
    api-key: ${CV_MATCHING_AZURE_OPENAI_API_KEY:${job-posting.parser.azure.api-key:}}
  openai:
    base-url: ${CV_MATCHING_OPENAI_BASE_URL:${job-posting.parser.openai.base-url:}}
    model: ${CV_MATCHING_OPENAI_MODEL:${job-posting.parser.openai.model:}}
    api-key: ${CV_MATCHING_OPENAI_API_KEY:${job-posting.parser.openai.api-key:}}

job-source:
  adzuna:
    base-url: ${JOBSOURCE_ADZUNA_BASE_URL:https://api.adzuna.com/v1/api}
    app-id: ${JOBSOURCE_ADZUNA_APP_ID:}
    app-key: ${JOBSOURCE_ADZUNA_APP_KEY:}
    country: ${JOBSOURCE_ADZUNA_COUNTRY:de}
    max-results-per-page: ${JOBSOURCE_ADZUNA_MAX_RESULTS:50}

storage:
  provider: ${STORAGE_PROVIDER:s3}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:3900}
    region: ${REGION:garage}
    bucket: ${S3_BUCKET:job-manager}
    access-key: ${ACCESS_KEY}
    secret-key: ${SECRET_KEY}
    # `none` stores documents as uploaded; `sse-c` has Garage encrypt every object with
    # the key below, which it does not keep - each read presents it again. Losing the key
    # loses every document, so back it up with the database. Off by default: switching it
    # on does not convert anything, it makes objects already in the bucket unreadable.
    # S3/Garage only; the azure provider has its own encryption story.
    encryption:
      mode: ${S3_SSE_C_MODE:none}
      key: ${S3_SSE_C_KEY:}
  azure:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container: ${AZURE_STORAGE_CONTAINER:documents}

server:
  port: 8060
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.springframework.security.oauth2: ${OAUTH2_LOG_LEVEL:INFO}
    org.springframework.web.client: ${WEB_CLIENT_LOG_LEVEL:INFO}
    de.ajm.manager.jobsearch: ${JOBSOURCE_LOG_LEVEL:INFO}
    ajm.diagnostics: ${DIAGNOSTICS_LOG_LEVEL:OFF}
job-manager:
  metrics:
    enabled: true
    log-status-transitions: true
  outbound:
    # How long OutboundUrlGuard pins the JVM's positive DNS cache. The guard
    # approves a host's addresses and then connects by name, so a zero TTL would
    # let the answer change in between - a positive value is the safe direction
    # here, which is the opposite of the usual advice.
    dns-cache-seconds: ${OUTBOUND_DNS_CACHE_SECONDS:30}
  security:
    claim: ${OIDC_ROLES_CLAIM:groups}
    role-groups:
      USER: ${GROUP_USER:User}
      ADVISOR: ${GROUP_ADVISOR:Advisor}
      REVIEWER: ${GROUP_REVIEWER:Reviewer}
  legal:
    # A directory of <slug>.<lang>.yaml files holding THIS deployment's privacy
    # policy and legal notice. Unset serves the documents bundled with the image,
    # which name the upstream author - fine for the original instance, wrong for
    # anyone else running it.
    #
    # Supplying any language of a document takes that document over completely:
    # no language of it falls back to the bundled text, because half of somebody
    # else's imprint is a false statement about who is responsible, not a
    # fallback. Startup fails if the directory is set but does not cover every
    # document.
    documents-dir: ${LEGAL_DOCUMENTS_DIR:}
    # The same files, read from an object-storage bucket instead - for a platform that
    # cannot mount files into a container (Scaleway Serverless Containers). Set this or
    # documents-dir, never both. Changes are picked up within reload-interval, with no
    # restart. Read without SSE-C: the bucket holds public legal text, not user documents.
    s3-bucket: ${LEGAL_DOCUMENTS_S3_BUCKET:}
    s3-prefix: ${LEGAL_DOCUMENTS_S3_PREFIX:}
    # Served when a document is not published in the requested language.
    default-language: ${LEGAL_DEFAULT_LANGUAGE:en}
    # How often to notice that a mounted ConfigMap changed underneath a running
    # pod. Zero disables re-reading.
    reload-interval: ${LEGAL_RELOAD_INTERVAL:30s}
    # Who runs this deployment. The bundled documents print these where they name the
    # person responsible; a document of your own may use {{operator.name}},
    # {{operator.email}} and {{operator.address}} too. Unset is not an error - the page
    # says "not provided" and the log warns - so the application can be tried out without
    # an imprint, but a public deployment must set at least name and email.
    operator:
      name: ${LEGAL_OPERATOR_NAME:}
      email: ${LEGAL_OPERATOR_EMAIL:}
      address: ${LEGAL_OPERATOR_ADDRESS:}
