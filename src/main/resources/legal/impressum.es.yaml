# Bundled default - the document served when a deployment publishes none of its own.
# The operator's name, email and address come from LEGAL_OPERATOR_NAME, _EMAIL and
# _ADDRESS (job-manager.legal.operator); the rest describes the stock stack. A deployment
# that differs from it publishes its own: see job-manager.legal.documents-dir.
language: es
title: "Aviso legal"
intro:
  - "Información conforme al § 5 DDG (Ley de Servicios Digitales, Alemania)."
sections:
  - heading: "Responsable del contenido de esta aplicación"
    blocks:
      - type: definitions
        items:
          - term: "Nombre"
            value: "{{operator.name|no indicado}}"
          - term: "Dirección"
            value: "{{operator.address}}"
          - term: "Correo electrónico"
            value: "{{operator.email|no indicado}}"
            href: "mailto:{{operator.email}}"
  - heading: "Naturaleza de esta aplicación"
    blocks:
      - type: paragraph
        text: "Esta aplicación se gestiona de forma privada y no comercial. Existe únicamente para ayudar a sus usuarios a organizar sus propias candidaturas de empleo; no se ofrece como un servicio comercial."
  - heading: "Responsabilidad por el contenido y los enlaces"
    blocks:
      - type: paragraph
        text: "Como proyecto privado y no comercial, esta aplicación se mantiene sobre una base de mejor esfuerzo, sin ninguna garantía de integridad, exactitud o disponibilidad."
      - type: paragraph
        text: "Esta aplicación puede enlazar a ofertas de empleo o sitios web de terceros. No se asume ninguna responsabilidad por el contenido de sitios externos; sus respectivos operadores son los únicos responsables de su contenido."
