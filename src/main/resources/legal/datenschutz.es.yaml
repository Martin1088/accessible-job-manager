# Bundled default - the document served when a deployment publishes none of its own.
# It names the upstream author, so any other deployment must replace it: see
# job-manager.legal.documents-dir in application.yml.
language: es
title: "Política de privacidad"
intro:
  - "Esta página explica qué datos personales procesa esta aplicación, por qué, y qué derechos tiene usted respecto a sus datos, conforme al Reglamento General de Protección de Datos (RGPD) de la UE."
sections:
  - heading: "Responsable del tratamiento"
    blocks:
      - type: definitions
        items:
          - term: "Nombre"
            value: "Martin Jurk"
          - term: "Correo electrónico"
            value: "access.job.manager@gmail.com"
            href: "mailto:access.job.manager@gmail.com"
  - heading: "Qué datos se procesan"
    blocks:
      - type: paragraph
        text: "Según cómo use la aplicación, se procesan los siguientes datos personales:"
      - type: list
        items:
          - "Datos de la cuenta de su inicio de sesión (nombre, dirección de correo electrónico, un identificador interno de sujeto y su rol asignado) proporcionados por el proveedor de inicio de sesión único usado para autenticarlo."
          - "Datos que introduce usted mismo: empresas, personas de contacto, puestos de trabajo, y sus candidaturas y su estado."
          - "Documentos que sube (p. ej. plantillas de carta de presentación) y los documentos de carta de presentación generados a partir de ellos, guardados en el almacenamiento de documentos de la aplicación."
          - "Si usa la función de compartir, a qué asesores o revisores les ha concedido acceso a qué documentos."
          - "Una cookie de sesión técnica usada para mantener su sesión iniciada. No se usan cookies publicitarias ni analíticas."
  - heading: "Base legal"
    blocks:
      - type: paragraph
        text: "El tratamiento es necesario para prestar la funcionalidad que usa (Art. 6(1)(b) RGPD). Cuando comparte activamente un documento con un asesor o revisor, ese acto de compartir se basa en su propia acción y consentimiento (Art. 6(1)(a) RGPD)."
  - heading: "Quién procesa sus datos"
    blocks:
      - type: paragraph
        text: "La aplicación se apoya en los siguientes componentes de backend para ofrecer su funcionalidad. Estos son operados por el responsable del tratamiento o su proveedor de alojamiento y no se usan para ningún fin ajeno al funcionamiento de esta aplicación:"
      - type: list
        items:
          - "Un proveedor de identidad (Authentik) para el inicio de sesión y la asignación de roles."
          - "Almacenamiento de objetos compatible con S3 (Garage) para los documentos subidos y generados."
          - "Un servicio de conversión de documentos (Gotenberg) usado para convertir los documentos de carta de presentación en PDF."
  - heading: "Duración del almacenamiento"
    blocks:
      - type: paragraph
        text: "Sus datos se conservan mientras exista su cuenta. Si desea que se eliminen su cuenta y los datos asociados, póngase en contacto con nosotros usando la dirección de correo electrónico de abajo."
  - heading: "Cookies"
    blocks:
      - type: paragraph
        text: "Solo se usa una cookie de sesión técnicamente necesaria para mantener su sesión iniciada. Se elimina al cerrar sesión o cuando su sesión caduca."
  - heading: "Sus derechos"
    blocks:
      - type: paragraph
        text: "Conforme al RGPD, tiene derecho a:"
      - type: list
        items:
          - "Acceder a los datos personales que tenemos sobre usted (Art. 15 RGPD)."
          - "Que se corrijan los datos inexactos (Art. 16 RGPD)."
          - "Que se eliminen sus datos (Art. 17 RGPD)."
          - "Solicitar la limitación del tratamiento (Art. 18 RGPD)."
          - "Recibir sus datos en un formato portable (Art. 20 RGPD)."
          - "Oponerse al tratamiento basado en interés legítimo (Art. 21 RGPD)."
          - "Presentar una reclamación ante una autoridad de control de protección de datos."
      - type: paragraph
        text: "Para ejercer cualquiera de estos derechos, póngase en contacto con nosotros en la dirección de correo electrónico anterior."
