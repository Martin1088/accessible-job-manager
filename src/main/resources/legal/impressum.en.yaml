# Bundled default - the document served when a deployment publishes none of its own.
# The operator's name, email and address come from LEGAL_OPERATOR_NAME, _EMAIL and
# _ADDRESS (job-manager.legal.operator); the rest describes the stock stack. A deployment
# that differs from it publishes its own: see job-manager.legal.documents-dir.
language: en
title: "Legal notice"
intro:
  - "Information according to § 5 DDG (Digital Services Act, Germany)."
sections:
  - heading: "Responsible for the content of this application"
    blocks:
      - type: definitions
        items:
          - term: "Name"
            value: "{{operator.name|not provided}}"
          - term: "Address"
            value: "{{operator.address}}"
          - term: "Email"
            value: "{{operator.email|not provided}}"
            href: "mailto:{{operator.email}}"
  - heading: "Nature of this application"
    blocks:
      - type: paragraph
        text: "This application is operated privately and non-commercially. It exists solely to help its users organize their own job applications; it is not offered as a commercial service."
  - heading: "Liability for content and links"
    blocks:
      - type: paragraph
        text: "As a private, non-commercial project, this application is maintained on a best-effort basis without any warranty as to completeness, accuracy, or availability."
      - type: paragraph
        text: "This application may link to third-party job postings or websites. No responsibility is accepted for the content of external sites; their respective operators are solely responsible for their content."
