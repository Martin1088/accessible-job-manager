# Bundled default - the document served when a deployment publishes none of its own.
# The operator's name, email and address come from LEGAL_OPERATOR_NAME, _EMAIL and
# _ADDRESS (job-manager.legal.operator); the rest describes the stock stack. A deployment
# that differs from it publishes its own: see job-manager.legal.documents-dir.
language: nl
title: "Colofon"
intro:
  - "Informatie conform § 5 DDG (Duitse wet digitale diensten)."
sections:
  - heading: "Verantwoordelijk voor de inhoud van deze toepassing"
    blocks:
      - type: definitions
        items:
          - term: "Naam"
            value: "{{operator.name|niet opgegeven}}"
          - term: "Adres"
            value: "{{operator.address}}"
          - term: "E-mail"
            value: "{{operator.email|niet opgegeven}}"
            href: "mailto:{{operator.email}}"
  - heading: "Aard van deze toepassing"
    blocks:
      - type: paragraph
        text: "Deze toepassing wordt privé en niet-commercieel beheerd. Ze bestaat uitsluitend om gebruikers te helpen bij het organiseren van hun eigen sollicitaties en wordt niet als commerciële dienst aangeboden."
  - heading: "Aansprakelijkheid voor inhoud en links"
    blocks:
      - type: paragraph
        text: "Als privé, niet-commercieel project wordt deze toepassing naar beste weten onderhouden, zonder garantie voor volledigheid, juistheid of permanente beschikbaarheid."
      - type: paragraph
        text: "Deze toepassing kan verwijzen naar vacatures of websites van derden. Voor de inhoud van externe sites wordt geen verantwoordelijkheid aanvaard; uitsluitend de betreffende beheerders zijn hiervoor verantwoordelijk."
