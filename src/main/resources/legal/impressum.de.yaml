# Bundled default - the document served when a deployment publishes none of its own.
# The operator's name, email and address come from LEGAL_OPERATOR_NAME, _EMAIL and
# _ADDRESS (job-manager.legal.operator); the rest describes the stock stack. A deployment
# that differs from it publishes its own: see job-manager.legal.documents-dir.
language: de
title: "Impressum"
intro:
  - "Angaben gemäß § 5 DDG (Digitale-Dienste-Gesetz)."
sections:
  - heading: "Verantwortlich für den Inhalt dieser Anwendung"
    blocks:
      - type: definitions
        items:
          - term: "Name"
            value: "{{operator.name|nicht hinterlegt}}"
          - term: "Anschrift"
            value: "{{operator.address}}"
          - term: "E-Mail"
            value: "{{operator.email|nicht hinterlegt}}"
            href: "mailto:{{operator.email}}"
  - heading: "Art dieser Anwendung"
    blocks:
      - type: paragraph
        text: "Diese Anwendung wird privat und nicht-kommerziell betrieben. Sie dient ausschließlich dazu, Nutzerinnen und Nutzern bei der Organisation ihrer eigenen Bewerbungen zu helfen, und wird nicht als kommerzieller Dienst angeboten."
  - heading: "Haftung für Inhalte und Links"
    blocks:
      - type: paragraph
        text: "Als privates, nicht-kommerzielles Projekt wird diese Anwendung nach bestem Wissen gepflegt, ohne Gewähr für Vollständigkeit, Richtigkeit oder ständige Verfügbarkeit."
      - type: paragraph
        text: "Diese Anwendung kann auf Stellenanzeigen oder Websites Dritter verlinken. Für die Inhalte externer Seiten wird keine Verantwortung übernommen; verantwortlich sind ausschließlich deren Betreiber."
