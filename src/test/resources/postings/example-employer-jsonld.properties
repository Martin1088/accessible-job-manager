# url is required: Jsoup resolves links against it, the ATS tier dispatches on
# its host, and several heuristics read the path. A fixture run against the
# wrong URL is not the extraction the server would have performed.
url=https://karriere.beispiel.example/stellen/senior-java-entwickler-BSP-2026-0184

# expect.<field> holds a parse that is already right. Fields: title,
# companyName, city, street, contactLastName, contactEmail, contactGender,
# sourceJobId, postedAt, deadline, employmentType.
# A fixture with no expect.* keys is reported but not asserted - the state a
# posting is in while its extraction is still being worked on.
expect.title=Senior Java Entwickler (m/w/d)
expect.companyName=Beispiel GmbH
expect.city=Köln
expect.street=Hohenzollernring 42
expect.sourceJobId=BSP-2026-0184
expect.postedAt=2026-08-14
expect.deadline=2026-10-31
expect.employmentType=FULL_TIME

# The contact tier reads these out of the "Ihr Kontakt" block, not the JSON-LD.
# contactGender is only ever set from the literal salutation word ("Frau"),
# never guessed from a first name - see jobimport/salutations.properties.
expect.contactLastName=Vogt
expect.contactGender=FEMALE
expect.contactEmail=bewerbung@beispiel.example
