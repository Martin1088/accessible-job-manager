 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.4.4'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

configurations { mockitoAgent }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.4.4')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.4.4')
    implementation 'org.docx4j:docx4j-JAXB-ReferenceImpl:11.5.3'
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'software.amazon.awssdk:s3:2.25.0'
    implementation 'com.azure:azure-storage-blob:12.29.0'
    implementation 'io.micrometer:micrometer-core'

    api libs.org.springframework.boot.spring.boot.starter.web
    api libs.org.projectlombok.lombok
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    api libs.org.springframework.boot.spring.boot.starter.security
    api libs.org.springframework.boot.spring.boot.starter.oauth2.client
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly libs.org.springframework.boot.spring.boot.devtools
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
    testRuntimeOnly 'com.h2database:h2'
    testImplementation libs.org.springframework.security.spring.security.test
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
    mockitoAgent(platform('org.springframework.boot:spring-boot-dependencies:3.4.4'))
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
}


group = 'de.samply'
version = '0.0.1-SNAPSHOT'
description = 'Management Portal'
java.sourceCompatibility = JavaVersion.VERSION_21
java.targetCompatibility = JavaVersion.VERSION_21

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
    exclude '**/AngularTemplateApplicationTests.class'
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}", "-Dnet.bytebuddy.experimental=true"
}

def frontendDir = "$projectDir/AppClient"
def staticDir = "$projectDir/src/main/resources/static"

// `npm run build` runs `ng build` with outputPath set (in angular.json) to
// write directly into src/main/resources/static, then moves the browser/
// subfolder contents up a level. There's no separate dist/ copy step to do
// afterwards - a previous copyFrontend Copy task pointed at a dist/ path
// that's never populated anymore and was always a NO-SOURCE no-op.
//
// outputs.dir is declared explicitly so Gradle (in particular the
// configuration cache) knows this Exec task writes into staticDir and
// correctly invalidates processResources' snapshot of src/main/resources
// afterwards. Without it, application.yml was intermittently missing from
// the built jar because processResources could reuse a stale, pre-npm-build
// snapshot of that directory.
tasks.register('npmBuild', Exec) {
    workingDir frontendDir
    inputs.dir("$frontendDir/src")
    inputs.dir("$frontendDir/public")
    inputs.files(
        "$frontendDir/package.json",
        "$frontendDir/package-lock.json",
        "$frontendDir/angular.json",
        "$frontendDir/tsconfig.json",
        "$frontendDir/tsconfig.app.json"
    )
    outputs.dir(staticDir)
    commandLine '/bin/sh', '-c', 'npm run build'
}

processResources.dependsOn npmBuild