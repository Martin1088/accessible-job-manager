/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.5.16'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

configurations { mockitoAgent }

configurations.testRuntimeClasspath {
    resolutionStrategy.force 'com.sun.xml.bind:jaxb-impl:2.3.2', 'com.sun.xml.bind:jaxb-core:2.3.0.1'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.docx4j:docx4j-JAXB-ReferenceImpl:11.5.3'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'software.amazon.awssdk:s3:2.25.0'
    implementation 'com.azure:azure-storage-blob:12.29.0'
    implementation 'io.micrometer:micrometer-core'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    // Reads the text out of a job posting the user printed to PDF, for boards
    // that answer 403 to a server. Was test-only (Din5008PdfGeometryTest,
    // CoverLetterPdfUaTest read generated PDFs back); PostingPdfTextExtractor
    // now needs it at runtime.
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    api libs.org.springframework.boot.spring.boot.starter.web
    api libs.org.projectlombok.lombok
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    api libs.org.springframework.boot.spring.boot.starter.security
    api libs.org.springframework.boot.spring.boot.starter.oauth2.client
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly libs.org.springframework.boot.spring.boot.devtools
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.verapdf:validation-model:1.28.1'
    testImplementation libs.org.springframework.security.spring.security.test
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
    mockitoAgent(platform('org.springframework.boot:spring-boot-dependencies:3.5.16'))
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
}


group = 'de.samply'

/*
 * The version is the release tag, so that `git describe`, the jar name and the
 * published image tag cannot drift apart - that identity is the point of the
 * whole release path, not a nicety.
 *
 * Two escape hatches, in this order:
 *
 *  - `-Pversion=0.2.0` wins outright. The image build needs it: `.dockerignore`
 *    excludes `.git` on purpose (`COPY . .` would otherwise bake the repository
 *    into a layer), so inside the builder there is nothing to describe from.
 *  - Without git, outside a repository, or with git refusing the directory
 *    (the "dubious ownership" case in a container), the fallback keeps the
 *    build running. A version string must never be the reason a build fails.
 *
 * Before the first tag `--always` yields the short commit hash, which is a
 * truthful answer: this build is not a release.
 */
def fallbackVersion = '0.0.0-SNAPSHOT'

def describedVersion = {
    try {
        def git = providers.exec {
            commandLine 'git', 'describe', '--tags', '--always', '--dirty'
            // Not a failure of the build - just no version to read here.
            ignoreExitValue = true
        }
        if (git.result.get().exitValue != 0) {
            return null
        }
        def described = git.standardOutput.asText.get().trim()
        return described.isEmpty() ? null : described.replaceFirst(/^v/, '')
    } catch (Exception ignored) {
        // git is not installed at all.
        return null
    }
}

version = providers.gradleProperty('version').getOrNull() ?: describedVersion() ?: fallbackVersion
description = 'Management Portal'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
    exclude '**/AngularTemplateApplicationTests.class'
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}", "-Dnet.bytebuddy.experimental=true"
}

def frontendDir = "$projectDir/AppClient"
def staticDir = "$projectDir/src/main/resources/static"

tasks.register('npmBuild', Exec) {
    workingDir frontendDir
    inputs.dir("$frontendDir/src")
    inputs.dir("$frontendDir/public")
    inputs.files(
        "$frontendDir/package.json",
        "$frontendDir/package-lock.json",
        "$frontendDir/angular.json",
        "$frontendDir/tsconfig.json",
        "$frontendDir/tsconfig.app.json"
    )
    outputs.dir(staticDir)
    commandLine '/bin/sh', '-c', 'npm run build'
}

processResources.dependsOn npmBuild

tasks.named('bootRun') {
    def envFile = file("$projectDir/dev/.env")
    if (!envFile.exists()) {
        return
    }
    envFile.readLines().each { line ->
        def entry = line.trim()
        if (entry.isEmpty() || entry.startsWith('#')) {
            return
        }
        def separator = entry.indexOf('=')
        if (separator <= 0) {
            return
        }
        def key = entry.substring(0, separator).trim()
        def value = entry.substring(separator + 1).trim().replaceAll(/^["']|["']$/, '')
        if (System.getenv(key) == null) {
            environment key, value
        }
    }
}