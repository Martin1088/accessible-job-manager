apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ajm.fullname" . }}-test-connection"
  labels:
    {{- include "ajm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-q', '-O', '/dev/null', 'http://{{ include "ajm.fullname" . }}:{{ .Values.service.port }}/index.html']
  restartPolicy: Never
