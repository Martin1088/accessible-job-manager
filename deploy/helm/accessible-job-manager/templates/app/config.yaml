apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ajm.fullname" . }}-config
  labels: {{- include "ajm.labels" . | nindent 4 }}
data:
  MANAGER_DB_URL: {{ include "ajm.dbUrl" . | quote }}
  OIDC_ISSUER_URI: {{ .Values.oidc.issuerUri | quote }}
  OIDC_AUTH_URI: {{ .Values.oidc.authUri | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_REDIRECT_URI: "https://{{ .Values.ingress.host }}/login/oauth2/code/authentik"
  COOKIE_SECURE: {{ .Values.ingress.tls.enabled | quote }}
  GROUP_USER: {{ .Values.oidc.groups.user | quote }}
  GROUP_ADVISOR: {{ .Values.oidc.groups.advisor | quote }}
  GROUP_REVIEWER: {{ .Values.oidc.groups.reviewer | quote }}
  STORAGE_PROVIDER: {{ .Values.storage.provider | quote }}
  JOB_POSTING_LLM_PROVIDER: {{ .Values.llm.provider | quote }}
{{- if .Values.gotenberg.enabled }}
  GOTENBERG_URL: "http://{{ include "ajm.fullname" . }}-gotenberg:3000"
{{- end }}
{{- if .Values.jobSource.adzuna.enabled }}
  JOBSOURCE_ADZUNA_APP_ID: {{ .Values.jobSource.adzuna.appId | quote }}
  JOBSOURCE_ADZUNA_COUNTRY: {{ .Values.jobSource.adzuna.country | quote }}
{{- end }}
