{{- if .Values.storage.s3.deployGarage -}}
{{- $secretName := printf "%s-garage-tokens" (include "ajm.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $rpcSecret := "" }}
{{- $adminToken := "" }}
{{- $metricsToken := "" }}
{{- if $existing }}
{{- $rpcSecret = index $existing.data "rpc-secret" | b64dec }}
{{- $adminToken = index $existing.data "admin-token" | b64dec }}
{{- $metricsToken = index $existing.data "metrics-token" | b64dec }}
{{- else }}
{{- $rpcSecret = randAlphaNum 64 }}
{{- $adminToken = randAlphaNum 44 }}
{{- $metricsToken = randAlphaNum 44 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ajm.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
type: Opaque
stringData:
  rpc-secret: {{ $rpcSecret | quote }}
  admin-token: {{ $adminToken | quote }}
  metrics-token: {{ $metricsToken | quote }}
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"

    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "{{ include "ajm.fullname" . }}-garage-0.{{ include "ajm.fullname" . }}-garage.{{ .Release.Namespace }}.svc.cluster.local:3901"
    rpc_secret = "{{ $rpcSecret }}"

    [s3_api]
    s3_region = {{ .Values.storage.s3.region | quote }}
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.localhost"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "{{ $adminToken }}"
    metrics_token = "{{ $metricsToken }}"
{{- if not .Values.storage.s3.existingSecret }}
{{- $s3SecretName := printf "%s-s3" (include "ajm.fullname" .) }}
{{- $existingS3 := lookup "v1" "Secret" .Release.Namespace $s3SecretName }}
{{- $accessKey := "" }}
{{- $secretKey := "" }}
{{- if $existingS3 }}
{{- $accessKey = index $existingS3.data "access-key" | b64dec }}
{{- $secretKey = index $existingS3.data "secret-key" | b64dec }}
{{- else }}
{{- $accessKey = printf "GK%s" (randAlphaNum 24 | lower) }}
{{- $secretKey = randAlphaNum 64 | lower }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s3SecretName }}
  labels:
    {{- include "ajm.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
type: Opaque
stringData:
  access-key: {{ $accessKey | quote }}
  secret-key: {{ $secretKey | quote }}
{{- end }}
{{- end }}
