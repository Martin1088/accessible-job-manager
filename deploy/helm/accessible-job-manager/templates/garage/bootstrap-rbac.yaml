{{- if and .Values.storage.s3.deployGarage .Values.storage.garage.bootstrap.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ajm.fullname" . }}-garage-bootstrap
  labels:
    {{- include "ajm.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ajm.fullname" . }}-garage-bootstrap
  labels:
    {{- include "ajm.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["{{ include "ajm.fullname" . }}-garage-0"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["{{ include "ajm.fullname" . }}-garage-0"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ajm.fullname" . }}-garage-bootstrap
  labels:
    {{- include "ajm.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ajm.fullname" . }}-garage-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "ajm.fullname" . }}-garage-bootstrap
    namespace: {{ .Release.Namespace }}
{{- end }}
