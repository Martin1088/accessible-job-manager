{{- if .Values.storage.s3.deployGarage }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ajm.fullname" . }}-garage
  labels:
    {{- include "ajm.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  serviceName: {{ include "ajm.fullname" . }}-garage
  replicas: 1
  selector:
    matchLabels:
      {{- include "ajm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: garage
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/garage/secret.yaml") . | sha256sum }}
      labels:
        {{- include "ajm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: garage
    spec:
      containers:
        - name: garage
          image: {{ .Values.storage.garage.image }}
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: web
              containerPort: 3902
            - name: admin
              containerPort: 3903
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.garage | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          secret:
            secretName: {{ include "ajm.fullname" . }}-garage-tokens
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.garage.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.storage.garage.storage.size }}
{{- end }}
