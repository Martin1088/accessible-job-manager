{{- if .Values.gotenberg.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ajm.fullname" . }}-gotenberg
  labels:
    {{- include "ajm.labels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "ajm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
{{- end }}
