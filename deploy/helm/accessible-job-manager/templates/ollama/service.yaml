{{- if .Values.llm.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ajm.fullname" . }}-ollama
  labels:
    {{- include "ajm.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: http
  selector:
    {{- include "ajm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
{{- end }}
