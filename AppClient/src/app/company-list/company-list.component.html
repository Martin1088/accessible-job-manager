<main id="main-content">
  <h1>Companies</h1>

  <app-status-message [message]="errorMessage" type="error" />

  <button (click)="create()">+ Add Company</button>

  <table aria-label="Company list">
    <thead>
    <tr>
      <th scope="col">Name</th>
      <th scope="col">City</th>
      <th scope="col">Position</th>
      <th scope="col">Contact</th>
      <th scope="col">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let company of companies">
      <td>{{ company.name }}</td>
      <td>{{ company.city }}</td>
      <td>{{ company.position }}</td>
      <td>{{ company.contact }}</td>
      <td>
        <button (click)="edit(company.id!)" aria-label="Edit {{ company.name }}">Edit</button>
        <button (click)="delete(company.id!)" aria-label="Delete {{ company.name }}">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>
</main>
