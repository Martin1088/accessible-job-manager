<main id="main-content" tabindex="-1">
  <h1>My Applications</h1>

  <p role="alert" class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <section class="create-form" *ngIf="showForm" aria-labelledby="create-heading">
    <h2 id="create-heading">New Application</h2>
    <dl class="position-info">
      <dt>Company</dt><dd>{{ newForm.companyName }}</dd>
      <dt>Position</dt><dd>{{ newForm.positionTitle }}</dd>
    </dl>

    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="field">
        <label for="status">Status</label>
        <select id="status" name="status" [(ngModel)]="newForm.status" required>
          <option *ngFor="let s of statusOptions" [value]="s">{{ statusLabel(s) }}</option>
        </select>
      </div>

      <div class="field">
        <label for="appliedDate">Applied date</label>
        <input id="appliedDate" name="appliedDate" type="date" [(ngModel)]="newForm.appliedDate">
      </div>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" [(ngModel)]="newForm.notes" rows="3"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="submitting || f.invalid">
          {{ submitting ? 'Saving…' : 'Create application' }}
        </button>
        <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </section>

  <div class="filter-bar" role="search" aria-label="Filter applications by date">
    <div class="filter-group">
      <label for="filter-year">Year</label>
      <select id="filter-year" [(ngModel)]="filterYear">
        <option [value]="''">All years</option>
        <option *ngFor="let y of availableYears" [value]="y">{{ y }}</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-month">Month</label>
      <select id="filter-month" [(ngModel)]="filterMonth">
        <option [value]="''">All months</option>
        <option *ngFor="let m of months; let i = index" [value]="i + 1">{{ m }}</option>
      </select>
    </div>
    <button type="button" class="btn-secondary" (click)="clearFilter()" *ngIf="filterActive"
            aria-label="Clear date filter">
      Clear filter
    </button>
  </div>

  <div role="region" aria-label="Applications overview" class="table-wrapper">
    <table>
      <caption>Applications overview</caption>
      <colgroup>
        <col class="col-company">
        <col class="col-position">
        <col class="col-status">
        <col class="col-applied">
        <col class="col-notes">
        <col class="col-cover">
      </colgroup>
      <thead>
        <tr>
          <th scope="col" *ngFor="let col of columns" [attr.aria-sort]="ariaSort(col.field)">
            <button type="button" (click)="sortBy(col.field)" [attr.aria-label]="col.label">
              {{ col.label }} <span aria-hidden="true">{{ sortIcon(col.field) }}</span>
            </button>
          </th>
          <th scope="col">Cover letter</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="sortedRows.length === 0">
          <td [attr.colspan]="columns.length + 1">
            <span role="status">No applications yet.</span>
          </td>
        </tr>
        <tr *ngFor="let row of sortedRows">
          <td *ngFor="let col of columns">{{ row[col.field] }}</td>
          <td class="cover-letter-cell">
            <label [for]="'tpl-' + row.id" class="sr-only">Template for {{ row.companyName }}</label>
            <select [id]="'tpl-' + row.id" [(ngModel)]="selectedTemplate[row.id]"
                    [disabled]="templates.length === 0" [name]="'tpl-' + row.id">
              <option value="" disabled selected>— select template —</option>
              <option *ngFor="let t of templates" [value]="t.id">{{ t.label }}</option>
            </select>
            <button type="button"
                    class="btn-download"
                    [disabled]="!selectedTemplate[row.id] || downloading[row.id]"
                    (click)="downloadCoverLetter(row.id)"
                    [attr.aria-label]="'Download cover letter for ' + row.companyName">
              {{ downloading[row.id] ? '…' : 'Download PDF' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
