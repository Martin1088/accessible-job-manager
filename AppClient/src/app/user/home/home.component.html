<main id="main-content" tabindex="-1">
  <h1>{{ 'HOME.TITLE' | translate }}</h1>

  <!-- Job posting import - the primary entry point, given a headline sheet. -->
  @if (profile) {
    <section class="job-import" aria-labelledby="job-import-heading">
      <h2 id="job-import-heading" class="section-tab">{{ 'HOME.JOB_IMPORT_HEADING' | translate }}</h2>
      <p class="job-import__lead">{{ 'HOME.JOB_IMPORT_LEAD' | translate }}</p>
      <app-job-posting-import
        submitLabelKey="HOME.USE_FOR_NEW_COMPANY"
        (imported)="onImported($event)" />
    </section>
  }

  @if (profileError) {
    <p role="alert" class="notice notice--error">{{ 'HOME.PROFILE_ERROR' | translate }}</p>
  }
</main>
