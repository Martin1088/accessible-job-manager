<main id="main-content" tabindex="-1">
  <h1>Job Manager</h1>

  <!-- Job posting import -->
  <section aria-labelledby="job-import-heading" *ngIf="profile">
    <h2 id="job-import-heading">Import a job posting</h2>
    <div class="job-import-card">
      <div class="field">
        <label for="job-url">Job posting URL</label>
        <input id="job-url" name="job-url" type="url" [(ngModel)]="jobUrl"
               placeholder="https://example.com/careers/job-123"/>
      </div>
      <div class="job-import-actions">
        <button type="button" class="btn-secondary" [disabled]="!jobUrl.trim()" (click)="searchJobPosting()">
          Search
        </button>
        <button type="button" class="btn-primary" [disabled]="!jobUrl.trim()" (click)="submitAsCompany()">
          Use for new company
        </button>
      </div>
    </div>
  </section>

  <p role="alert" *ngIf="profileError">Could not load profile.</p>

  <!-- Quick navigation -->
  <section aria-labelledby="nav-heading">
    <h2 id="nav-heading">Where do you want to go?</h2>
    <ul class="quick-nav" role="list">
      <li>
        <a routerLink="/companies">
          <span class="quick-nav__title">Companies</span>
          <span class="quick-nav__desc">Manage companies you are applying to.</span>
        </a>
      </li>
      <li>
        <a routerLink="/applications">
          <span class="quick-nav__title">Applications</span>
          <span class="quick-nav__desc">Track your job applications and their status.</span>
        </a>
      </li>
    </ul>
  </section>
</main>
