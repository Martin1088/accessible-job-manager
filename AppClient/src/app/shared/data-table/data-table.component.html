<div role="region" [attr.aria-label]="caption">
  <table>
    <caption>{{ caption }}</caption>

    <thead>
      <tr>
        <th
          scope="col"
          *ngFor="let col of columns"
          [attr.aria-sort]="sortField === col.field
            ? (sortDirection === 'asc' ? 'ascending' : 'descending')
            : 'none'">

          <button
            *ngIf="col.sortable"
            type="button"
            (click)="sortBy(col.field)"
            [attr.aria-label]="sortLabel(col)">
            {{ col.label }}
            <span aria-hidden="true">{{ sortIcon(col.field) }}</span>
          </button>

          <span *ngIf="!col.sortable">{{ col.label }}</span>
        </th>

        <th scope="col" *ngIf="actions.length > 0">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngIf="sortedRows.length === 0">
        <td [attr.colspan]="columns.length + (actions.length > 0 ? 1 : 0)">
          <span role="status">{{ emptyMessage }}</span>
        </td>
      </tr>

      <tr *ngFor="let row of sortedRows">
        <td *ngFor="let col of columns">{{ row[col.field] }}</td>
        <td *ngIf="actions.length > 0">
          <button
            *ngFor="let action of actions"
            type="button"
            (click)="action.handler(row)"
            [attr.aria-label]="action.ariaLabel(row)">
            {{ action.label }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
