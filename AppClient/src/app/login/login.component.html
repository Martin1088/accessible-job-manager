<main id="main-content" tabindex="-1">
  <div class="letter">
    <!--
      DIN 5008 fold marks - real business letters carry two small unlabeled
      tick marks on the page edge so the sheet lines up in a C6/5 window
      envelope when folded. Positions match FIRST_FOLD_MARK_MM (87mm) and
      SECOND_FOLD_MARK_MM (192mm) of a 297mm page in StyleSettings.java -
      the same geometry this app's own cover-letter generator prints.
      Decorative only.
    -->
    <span class="fold-mark fold-mark--upper" aria-hidden="true"></span>
    <span class="fold-mark fold-mark--lower" aria-hidden="true"></span>

    <!-- The 24.1mm writing-area margin from StyleSettings.din5008FormB(). -->
    <span class="margin-guide" aria-hidden="true">
      <span class="margin-guide__label">24.1mm</span>
    </span>

    <div class="letterhead">
      <!-- Decorative: the h1 text alongside it already gives the accessible name. -->
      <img class="logo" src="/juke.png" alt="" width="256" height="256" />

      <div class="letterhead__text">
        <h1>Job Manager</h1>
        <p class="tagline">Track applications and write cover letters</p>
      </div>
    </div>

    @if (error) {
      <p role="alert" class="error">{{ error }}</p>
    }

    <div class="rule" aria-hidden="true"></div>

    <nav aria-label="Sign in options">
      <ul role="list" class="login-options login-options--primary">
        <li>
          <button type="button" (click)="loginAsUser()" class="btn-primary">
            Continue as User
          </button>
        </li>
      </ul>

      <div role="group" aria-labelledby="other-roles-heading" class="other-roles">
        <p id="other-roles-heading" class="section-label">Other roles</p>
        <ul role="list" class="login-options login-options--secondary">
          <li>
            <button type="button" (click)="loginAsAdvisor()" class="btn-secondary">
              Continue as Advisor
            </button>
          </li>
          <li>
            <button type="button" (click)="loginAsReviewer()" class="btn-secondary">
              Continue as Reviewer
            </button>
          </li>
        </ul>
      </div>
    </nav>
  </div>
</main>
