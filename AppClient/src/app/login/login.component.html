<main id="main-content" tabindex="-1">
  <div class="login-card">
    <h1>Job Manager</h1>
    <p class="subtitle">Sign in to continue</p>

    @if (error) {
      <p role="alert" class="error">{{ error }}</p>
    }

    <nav aria-label="Login options">
      <ul role="list" class="login-options">
        <li>
          <button type="button" (click)="loginAsUser()" class="btn-primary">
            Login as User
          </button>
        </li>
        <li>
          <button type="button" (click)="loginAsAdvisor()" class="btn-secondary">
            Login as Advisor
          </button>
        </li>
        <li>
          <button type="button" (click)="loginAsReviewer()" class="btn-secondary">
            Login as Reviewer
          </button>
        </li>
      </ul>
    </nav>
  </div>
</main>
