services:
  
  postgres:
    image: postgres:16
    container_name: manager-postgres
    environment:
      POSTGRES_DB: manager
      POSTGRES_USER: ${MANAGER_DB_USER:-manager}
      POSTGRES_PASSWORD: ${MANAGER_DB_PASSWORD:?set MANAGER_DB_PASSWORD in dev/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - web

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    ports:
      - "3000:3000"
    networks:
      - web

  garage:
    image: dxflrs/garage:v2.1.0
    container_name: garage
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - ./meta:/var/lib/garage/meta
      - ./garage-data:/var/lib/garage/data
    ports:
      - "3900:3900"   # S3
      - "3901:3901"   # Admin API
      - "3902:3902"
      - "3903:3903"
    networks:
      - web

  webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
    ports:
      - "3909:3909"
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    networks:
      - web

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - web

volumes:
  postgres-data: {}
  ollama_models: {}

networks:
  web: {}
