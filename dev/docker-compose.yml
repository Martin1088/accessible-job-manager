version: "3.9"

services:
  traefik:
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - web

  accessible-job-manager:
    container_name: accessible-job-manager
    image: ghcr.io/martin1088/accessible-job-manager:sha-d97bfdf
    ports:
      - "8060:8060"
    environment:
      MANAGER_DB_URL: jdbc:postgresql://postgres:5432/manager
      MANAGER_DB_USER: manager
      MANAGER_DB_PASSWORD: manager
      OIDC_ISSUER_URI: http://host.docker.internal:9000/application/o/access-job-manager/
      GOTENBERG_URL: http://gotenberg:3000
      # Advisor job search stays off unless the operator supplies their own
      # Adzuna key - see docs/local-development.md.
      JOBSOURCE_ADZUNA_APP_ID: ${JOBSOURCE_ADZUNA_APP_ID:-}
      JOBSOURCE_ADZUNA_APP_KEY: ${JOBSOURCE_ADZUNA_APP_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.login.rule=Host(`login.localhost`)"
      - "traefik.http.routers.login.entrypoints=web"
      - "traefik.http.routers.login.middlewares=error-pages-mw"
      - "traefik.http.services.login.loadbalancer.server.port=8060"
    networks:
      - web
      - render

  error-pages:
    image: nginx:alpine
    volumes:
      - ./error-pages:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.error-pages.loadbalancer.server.port=80"
    networks:
      - web

  postgres:
    image: postgres:16
    container_name: manager-postgres
    environment:
      POSTGRES_DB: manager
      POSTGRES_USER: manager
      POSTGRES_PASSWORD: manager
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - web

  # Gotenberg is the one service that fetches attacker-supplied URLs: the job
  # posting snapshot is rendered by its Chromium, which resolves and fetches the
  # page itself and follows its own redirects. Nothing the application validates
  # constrains it, so it is kept off `web` and reachable only from the app over
  # `render` - it cannot resolve postgres, garage, traefik or the Authentik
  # stack. It must never be given the app's `extra_hosts: host.docker.internal`
  # either. Internet egress it still has, by necessity; see the Gotenberg
  # isolation section in Readme.md for what production has to add on top.
  #
  # The published port is host -> container only and adds no network membership;
  # Din5008PdfGeometryTest and CoverLetterPdfUaTest need it.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    restart: unless-stopped
    # --chromium-deny-private-ips is the half of the SSRF defence OutboundUrlGuard
    # structurally cannot cover: the guard checks the address the user submitted,
    # from the application's vantage point, and then Chromium resolves and
    # follows redirects on its own. This rejects a private address at every hop,
    # inside the process that actually connects. It does not replace the guard -
    # it covers loopback, RFC1918, link-local and unique-local, while the guard
    # additionally rejects CGNAT 100.64/10, 198.18/15, 192.0.0.0/24 and 0.0.0.0/8.
    #
    # Deliberately not --chromium-deny-list: that flag has a non-empty default
    # (^file:(?!//\/tmp/).*) which is what blocks file:// reads, and setting it
    # without carrying that pattern over would silently re-enable them.
    #
    # --api-timeout is Gotenberg's own default (30s), pinned because the client
    # read timeout is set relative to it - see gotenberg.read-timeout-seconds.
    command:
      - gotenberg
      - --chromium-deny-private-ips
      - --api-timeout=30s
    ports:
      - "3000:3000"
    networks:
      - render

  garage:
    image: dxflrs/garage:v2.1.0
    container_name: garage
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - ./meta:/var/lib/garage/meta
      - ./garage-data:/var/lib/garage/data
    restart: unless-stopped
    ports:
      - "3900:3900"   # S3
      - "3901:3901"   # Admin API
      - "3902:3902"
      - "3903:3903"
    networks:
      - web

  webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
    ports:
      - "3909:3909"
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    networks:
      - web

networks:
  # The data plane: app, proxy, database, object storage.
  web: {}
  # Rendering only: the app and Gotenberg, nothing else. Splitting these two is
  # what keeps a job posting URL that redirects to http://postgres:5432 from
  # being rendered from inside the data plane.
  render: {}
