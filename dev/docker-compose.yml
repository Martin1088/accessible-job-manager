version: "3.9"

services:
  traefik:
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - web

  login-test:
    container_name: login-course-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8060"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.login.rule=Host(`login.localhost`)"
      - "traefik.http.routers.login.entrypoints=web"
      - "traefik.http.routers.login.middlewares=error-pages-mw"
      - "traefik.http.services.login.loadbalancer.server.port=8080"
    networks:
      - web

  error-pages:
    image: nginx:alpine
    volumes:
      - ./error-pages:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.error-pages.loadbalancer.server.port=80"
    networks:
      - web

networks:
  web: {}