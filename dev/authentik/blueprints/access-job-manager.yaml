version: 1
metadata:
  name: accessible-job-manager
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_core.group
    identifiers:
      name: User

  - model: authentik_core.group
    identifiers:
      name: Advisor

  - model: authentik_core.group
    identifiers:
      name: Reviewer

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Provider for access-job-manager
    attrs:
      client_type: confidential
      client_id: !Env OIDC_CLIENT_ID
      client_secret: !Env OIDC_CLIENT_SECRET
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      # authentik 2026.x added an explicit grant-type allowlist on the
      # provider; unlike the similarly-named field on dynamic client
      # registration, an empty list here means NO grant type is permitted
      # (see https://docs.goauthentik.io/docs/add-secure-apps/providers/oauth2/),
      # so every /authorize request 400s with "Invalid grant_type for
      # provider" unless this is set. The app only ever does the
      # authorization-code flow and refreshes its session token.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-explicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      redirect_uris:
        - matching_mode: strict
          url: !Env OIDC_REDIRECT_URI
        - matching_mode: strict
          url: !Env [OIDC_POST_LOGOUT_REDIRECT_URI, "http://localhost:8060/"]
      property_mappings:
        - !Find [
            authentik_core.propertymapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_core.propertymapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_core.propertymapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]

  - model: authentik_core.application
    identifiers:
      slug: access-job-manager
    attrs:
      name: access-job-manager
      provider: !KeyOf provider
